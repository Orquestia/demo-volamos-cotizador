<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Volamos Cotizador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca Volamos (volamos.com.co): rojo #E72929, Montserrat en títulos, Source Sans en texto.
   Layout: herramienta de escritorio — barra superior, riel de navegación, área de trabajo; en móvil el riel baja a una barra inferior. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F3F3; --line:#E6E0E0;
  --ink:#1E293B; --muted:#5E6A7F; --brand:#E72929; --brand-ink:#FFFFFF; --accent:#C81F1F; --accent-ink:#FFFFFF; --accent-soft:#FDE6E6;
  --sun:#A86A12; --sun-soft:#FBEFD9; --danger:#9B1C1C; --danger-soft:#F9DEDE; --ok:#2F7D4A; --ok-soft:#E0F1E5;
  --wa-bg:#EAE3D9; --wa-in:#FFFFFF; --wa-out:#D9F7C8; --wa-head:#0F6E5F; --wa-ink:#111B21;
  --paper:#FFFFFF; --paper-ink:#1A2733; --paper-muted:#5E6B75; --paper-line:#E1E6EA; --paper-accent:#C81F1F;
  --shadow:0 1px 2px rgba(19,40,58,.06),0 6px 20px rgba(19,40,58,.06);
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3","Source Sans Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
:root[data-theme="dark"]{
  --bg:#17141A; --surface:#211C22; --surface-2:#2A2429; --line:#3A3238;
  --ink:#F1ECEC; --muted:#AFA4A8; --brand:#C81F1F; --brand-ink:#FFFFFF; --accent:#FF7A72; --accent-ink:#2A0606; --accent-soft:#45201F;
  --sun:#E8B45C; --sun-soft:#3A2E17; --danger:#FF9A8F; --danger-soft:#43201D; --ok:#6BC58A; --ok-soft:#183324;
  --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#005C4B; --wa-head:#1F2C33; --wa-ink:#E9EDEF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:84px 1fr;grid-template-areas:"top top" "rail main"}
.top{grid-area:top;display:flex;align-items:center;gap:14px;color:var(--brand-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--brand);border-bottom:1px solid var(--brand)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand img{height:34px;width:auto;display:block}
.brand .wordmark{font-style:italic}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:#FFFFFFCC;margin-left:2px;padding-left:10px;border-left:1px solid #FFFFFF55}
.demo-flag{margin-left:auto;font-size:12px;color:#fff;background:#00000026;padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#FFFFFFDD}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:12px;flex:none}

.rail{grid-area:rail;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px}
.rail button{border:0;background:transparent;border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);position:relative}
.rail button svg{width:22px;height:22px}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .badge{position:absolute;top:4px;right:10px;background:var(--brand);color:#fff;font-size:10px;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:600}

.main{grid-area:main;overflow:auto;min-width:0}
.view{padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:26px}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.wa{background:#1DA851;border-color:#1DA851;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.nuevo{background:var(--accent-soft);color:var(--accent)}
.pill.cotizando{background:var(--sun-soft);color:var(--sun)}
.pill.borrador{background:var(--surface-2);color:var(--ink)}
.pill.enviado{background:var(--ok-soft);color:var(--ok)}
.pill.ganado{background:var(--ok);color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* Métricas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;min-width:0}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;padding:2px 4px}
.col-head .count{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-name{font-weight:600;font-size:14px}
.card-time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.route{font-family:var(--f-mono);font-size:12.5px;display:flex;align-items:center;gap:6px}
.route .arrow{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.card .new-flag{font-size:11px;color:var(--danger);font-weight:600}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.src{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.src svg{width:13px;height:13px;color:#1DA851}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(9,20,27,.42);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--surface);padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-right:max(22px,env(safe-area-inset-right,0px));overflow:auto;display:flex;flex-direction:column;gap:18px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer h2{font-size:22px}
.close{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.transcript{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;max-height:240px;overflow:auto}
.transcript p{margin:0}
.transcript b{font-weight:600}

/* Workspace de cotizaciones */
.ws{display:flex;flex-direction:column;height:100%;min-height:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--surface-2);border-radius:10px 10px 0 0;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:600;position:relative;top:1px}
.tab .mono{font-size:11px}
.ws-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:100%;min-width:0}
.msg .who-ic{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-family:var(--f-mono)}
.msg.agent .who-ic{background:var(--accent);color:var(--accent-ink)}
.msg.user{flex-direction:row-reverse}
.msg.user .who-ic{background:var(--surface-2);color:var(--ink);font-family:var(--f-body);font-weight:600}
.bubble{flex:0 1 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;max-width:min(560px,100%)}
.msg.user .bubble{background:var(--accent-soft);border-color:transparent}
.bubble p{margin:0 0 6px}.bubble p:last-child{margin:0}
.bubble .time{font-size:11px;color:var(--muted);margin-top:4px}
.prov-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prov{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:7px 9px;border-radius:8px;background:var(--surface-2)}
.prov .via{font-size:11px;color:var(--muted);display:block}
.prov .res{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check{color:var(--ok)}
.tbl-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
table.cmp th,table.cmp td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
table.cmp tr:last-child td{border-bottom:0}
.save{color:var(--ok);font-weight:600}
.internal{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--danger);font-weight:600;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--accent);font-weight:500}
.chip:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
.draft-col{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface-2)}
.draft-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.draft-bar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.seg{display:none}
.ws-empty{padding:40px 20px;max-width:560px;margin:40px auto;text-align:center;color:var(--muted)}
.ws-empty h2{color:var(--ink);font-size:22px;margin-bottom:8px}

/* Documento (PDF) */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:28px 26px;font-size:12.5px;max-width:640px;width:100%;margin:0 auto}
.paper .doc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#E72929;color:#fff;margin:-28px -26px 16px;padding:16px 26px;border-radius:4px 4px 0 0;flex-wrap:wrap}
.paper .doc-brand img{height:38px;width:auto;display:block}
.paper .doc-brand{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--paper-accent)}
.paper .doc-brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:#FFFFFFD9;margin-top:3px}
.paper .doc-id{text-align:right;font-size:11px;color:#FFFFFFD9}
.paper .doc-id b{display:block;font-family:var(--f-mono);font-size:13px;color:#fff;font-weight:500}
.paper h3{font-size:17px;margin-bottom:4px;color:var(--paper-ink)}
.paper .trip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:#FBF1F1;border-radius:6px;padding:10px;margin:12px 0 16px}
.paper .trip span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-muted)}
.paper .trip b{font-weight:600;font-size:12.5px}
.opt{border:1px solid var(--paper-line);border-radius:8px;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
.opt.rec{border-color:var(--paper-accent);box-shadow:inset 3px 0 0 var(--paper-accent)}
.opt-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.opt-head h4{margin:0;font-family:var(--f-display);font-size:15px}
.opt-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-accent)}
.opt ul{margin:0 0 8px;padding-left:16px;color:var(--paper-ink)}
.opt li{margin:2px 0}
.opt-price{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-top:1px dashed var(--paper-line);padding-top:8px;flex-wrap:wrap}
.opt-price .total{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.opt-price .pp{font-size:11px;color:var(--paper-muted)}
.opt-price .web{font-size:11px;color:var(--paper-muted);text-align:right}
.opt-price .web b{color:#2F7D4A}
.stars{color:#C98A1B;letter-spacing:1px}
.doc-notes{font-size:10.5px;color:var(--paper-muted);border-top:1px solid var(--paper-line);padding-top:10px;margin-top:12px}
.doc-notes p{margin:0 0 4px}
.doc-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:11px;color:var(--paper-muted);flex-wrap:wrap}
.watermark{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#E72929;background:#fff;border:1px solid #fff;padding:2px 6px;border-radius:3px}

/* WhatsApp */
.wa-layout{display:grid;grid-template-columns:250px minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.convos{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.convos-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.convo{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 12px;display:flex;gap:10px;align-items:center}
.convo[aria-current="true"]{background:var(--accent-soft)}
.convo .c-txt{min-width:0;flex:1}
.convo .c-name{font-weight:600;font-size:13px}
.convo .c-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-select{display:none}
.phone{border:10px solid #1B2328;border-radius:34px;overflow:hidden;background:var(--wa-bg);height:640px;max-height:calc(100vh - 170px);min-height:460px;display:flex;flex-direction:column;box-shadow:var(--shadow);max-width:100%}
.wa-head{background:var(--wa-head);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.wa-head .avatar{background:#ffffff33;color:#fff}
.wa-head b{display:block;font-size:14px}
.wa-head span{font-size:11px;opacity:.8}
.wa-msgs{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;color:var(--wa-ink)}
.wb{max-width:82%;padding:6px 9px 4px;border-radius:8px;font-size:13.5px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line}
.wb.in{background:var(--wa-in);align-self:flex-start;border-top-left-radius:0}
.wb.out{background:var(--wa-out);align-self:flex-end;border-top-right-radius:0}
.wb .t{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:2px}
.wb.sys{align-self:center;background:var(--wa-in);font-size:11.5px;opacity:.85;text-align:center;max-width:90%}
.pdf-att{display:flex;gap:10px;align-items:center;background:#00000010;border-radius:6px;padding:8px;margin-bottom:4px;border:0;width:100%;text-align:left;color:inherit}
.pdf-ic{width:34px;height:40px;background:#D9452F;color:#fff;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.pdf-att b{display:block;font-size:12.5px}
.pdf-att span{font-size:11px;opacity:.7}
.wa-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;justify-content:flex-end}
.wa-chip{border:1px solid #1DA85188;background:var(--wa-in);color:var(--wa-ink);border-radius:999px;padding:5px 11px;font-size:12.5px}
.wa-input{display:flex;gap:6px;padding:8px;background:var(--wa-bg)}
.wa-input input{flex:1;min-width:0;border:0;border-radius:999px;padding:9px 14px;background:var(--wa-in);color:var(--wa-ink)}
.wa-input button{border:0;width:40px;height:40px;border-radius:50%;background:#1DA851;color:#fff;display:grid;place-items:center;flex:none}
.typing{align-self:flex-start;background:var(--wa-in);border-radius:8px;padding:8px 12px;font-size:12px;opacity:.75}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.explain ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.explain ol b{color:var(--ink)}
.captured{display:flex;flex-direction:column;gap:6px}
.cap-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.cap-row span{color:var(--muted)}
.cap-row b{text-align:right;font-weight:500}
.cap-row.pending b{color:var(--muted);font-weight:400}

/* Ajustes */
.settings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:17px}
.field{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
.field label{font-weight:500}
.field small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.field .inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.field input{width:100%;border:0;background:transparent;padding:8px 10px;text-align:right;font-family:var(--f-mono)}
.field .unit{padding:0 10px;color:var(--muted);font-size:12px}
.conn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.conn b{font-size:14px}
.conn p{margin:0;grid-column:1/-1;color:var(--muted);font-size:12.5px}
.conn .via{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(9,20,27,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px}
.modal-inner{width:min(680px,100%);display:flex;flex-direction:column;gap:10px}
.modal-inner .close{align-self:flex-end;background:var(--surface)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13px;max-width:min(380px,calc(100vw - 32px));animation:rise .25s ease-out}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;white-space:nowrap}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .wa-layout{grid-template-columns:minmax(0,380px) minmax(0,1fr)}
  .convos{display:none}
  .convo-select{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:10px}
  .settings{grid-template-columns:1fr}
}
@media (max-width:860px){
  .ws-body{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px;margin:10px 16px 0}
  .seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px;font-weight:600;font-size:13px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
  .ws-body[data-pane="chat"] .draft-col{display:none}
  .ws-body[data-pane="draft"] .chat{display:none}
  .chat{border-right:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wa-layout{grid-template-columns:1fr}
  .phone{height:560px}
}
@media (max-width:640px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "main" "rail"}
  .rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .rail button{flex:1}
  .who span{display:none}
  .demo-flag{font-size:11px;padding:3px 8px}
  .brand small{display:none}
  .paper{padding:18px 14px}
  .paper .doc-head{margin:-18px -14px 14px;padding:14px}
  .paper .trip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:110px 1fr}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}

const PROV = [

const STAGES = [["nuevo","Nuevo"],["cotizando","Cotizando"],["borrador","Borrador listo"],["enviado","Enviado"],["ganado","Ganado"]];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = n => "$" + Math.round(n).toLocaleString("es-CO");
const copM = n => "$" + (n/1e6).toLocaleString("es-CO",{maximumFractionDigits:1}) + " M";
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%10000)/10000}
const hhmm = d => d.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
const stars = n => "★".repeat(n);
const initials = n => n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const paxLabel = p => `${p.a} adulto${p.a>1?"s":""}${p.n?` + ${p.n} niño${p.n>1?"s":""}`:""}`;
const incLabel = {full:"Vuelo + hotel + tours",fh:"Vuelo + hotel",h:"Solo hotel"};
function ago(d){const m=Math.round((Date.now()-d)/60000);if(m<1)return "ahora";if(m<60)return `hace ${m} min`;return `hace ${Math.round(m/60)} h`}

/* ---------- Estado ---------- */
const now = Date.now();
const state = {
  view:"leads", drawer:null, modal:null, seq:143, activeQuote:null, pane:"chat",
  settings:{mHotel:12,mFlight:6,mTour:15,validity:48},
  leads:[
    {id:"L1",name:"Laura Gómez",phone:"+57 310 *** **21",dest:"cun",orig:"BOG",dates:{label:"15 – 20 dic 2026",nights:5},pax:{a:2,n:0},inc:"full",budget:"$3 – 5 M por persona",stage:"nuevo",at:now-14*60000,fresh:true},
    {id:"L2",name:"Andrés Rojas",phone:"+57 300 *** **08",dest:"puj",orig:"MDE",dates:{label:"8 – 14 ene 2027",nights:6},pax:{a:2,n:2},inc:"fh",budget:"Más de $5 M por persona",stage:"nuevo",at:now-38*60000,fresh:true},
    {id:"L3",name:"Camila Torres",phone:"+57 315 *** **77",dest:"adz",orig:"CLO",dates:{label:"6 – 10 ene 2027",nights:4},pax:{a:2,n:0},inc:"full",budget:"Hasta $3 M por persona",stage:"nuevo",at:now-72*60000,fresh:false},
    {id:"L4",name:"Julián Pérez",phone:"+57 301 *** **45",dest:"ctg",orig:"BOG",dates:{label:"27 – 30 nov 2026",nights:3},pax:{a:1,n:0},inc:"h",budget:"Prefiero ver opciones",stage:"enviado",at:now-5*3600000,fresh:false,sentAt:now-3*3600000},
    {id:"L5",name:"Marta Díaz",phone:"+57 312 *** **90",dest:"cun",orig:"BOG",dates:{label:"20 – 25 nov 2026",nights:5},pax:{a:2,n:0},inc:"fh",budget:"$3 – 5 M por persona",stage:"ganado",at:now-26*3600000,fresh:false,sentAt:now-24*3600000}
  ],
  quotes:[],
  wa:{active:"L1",convos:{},intake:null,typing:null}
};
let lastQuoteSecs = null;

/* Conversaciones de WhatsApp sembradas a partir de cada lead */
function seedConvo(l){
  const d=DEST[l.dest],t=l.at;
  return [
    {dir:"in",txt:"Hola, quiero cotizar un viaje",at:t-180000},
    {dir:"out",txt:`¡Hola! Soy el asistente de Volamos ✈️\nTe hago unas preguntas cortas para armar tu cotización.\n\nAl continuar aceptas el tratamiento de tus datos según nuestra política (Ley 1581 de 2012).\n\n¿Cómo te llamas?`,at:t-175000},
    {dir:"in",txt:l.name,at:t-160000},
    {dir:"out",txt:`Mucho gusto, ${l.name.split(" ")[0]}. ¿A qué destino quieres viajar?`,at:t-158000},
    {dir:"in",txt:d.city,at:t-140000},
    {dir:"out",txt:"¿Desde qué ciudad sales?",at:t-138000},
    {dir:"in",txt:ORIG[l.orig].city,at:t-120000},
    {dir:"out",txt:"¿Qué fechas tienes en mente?",at:t-118000},

}
state.leads.forEach(l=>{
  state.wa.convos[l.id]=seedConvo(l);
  if(l.sentAt){

    state.wa.convos[l.id].push({dir:"out",pdf:{code,static:true},txt:`Hola ${l.name.split(" ")[0]}, te comparto tu cotización para ${DEST[l.dest].city}. Tiene vigencia de 48 horas.`,at:l.sentAt});

/* ---------- Motor de cotización (simulado) ---------- */
function compute(lead,q){
  const d=DEST[lead.dest], m=q.m, e=q.edits;
  const rooms=Math.max(1,Math.ceil(lead.pax.a/2)), nights=lead.dates.nights, pax=lead.pax.a+lead.pax.n;
  const hasF=lead.inc!=="h", hasT=lead.inc==="full" && !e.noTours;
  const hotelOffers=d.hotels.map(h=>{
    let offers=PROV.filter(p=>p.prod.includes("hotel")&&hash(p.id+h.n)>0.22);
    if(!offers.length) offers=[PROV[2]];
    const best=offers.map(p=>({p,net:h.b*nights*rooms*(0.84+0.12*hash(p.id+h.n+"f"))})).sort((a,b)=>a.net-b.net)[0];
    return {...h,prov:best.p.name,net:best.net,web:best.net*(1.19+0.07*hash(h.n))};
  });
  const sorted=[...hotelOffers].sort((a,b)=>a.s-b.s||a.net-b.net);
  const econ=sorted[0], prem=sorted[sorted.length-1];
  const rec=sorted.find(h=>h.s===4)||sorted[Math.floor(sorted.length/2)];
  const fl=PROV.filter(p=>p.prod.includes("vuelo")).map(p=>({p,net:d.fly*ORIG[lead.orig].f*(0.9+0.08*hash(p.id+lead.dest))})).sort((a,b)=>a.net-b.net)[0];
  const flightNet=fl.net*(lead.pax.a+0.9*lead.pax.n);
  const tourBest=t=>{const o=PROV.filter(p=>p.prod.includes("tour")).map(p=>({p,net:t.p*(lead.pax.a+0.7*lead.pax.n)*(0.86+0.08*hash(p.id+t.n))})).sort((a,b)=>a.net-b.net)[0];return {n:t.n,prov:o.p.name,net:o.net}};
  const tiers=[["econ","Económica",econ,1],["rec","Recomendada",rec,2],["prem","Premium",prem,3]].map(([key,label,h,nt])=>{
    const lines=[{k:"hotel",label:`${h.n} · ${nights} noches · ${rooms} hab.`,prov:h.prov,net:h.net,sale:h.net*(1+m.h/100),web:h.web}];
    if(hasF){const net=flightNet*(key==="prem"?1.08:1);lines.push({k:"vuelo",label:`Vuelo ${lead.orig} ⇄ ${d.iata} · ${d.air}${key==="prem"?" · horario preferente":""}`,prov:fl.p.name,net,sale:net*(1+m.f/100),web:net*1.11})}
    if(hasT) d.tours.slice(0,nt).forEach(t=>{const b=tourBest(t);lines.push({k:"tour",label:b.n,prov:b.prov,net:b.net,sale:b.net*(1+m.t/100),web:b.net*1.27})});
    if(e.transfers){const net=95000*pax;lines.push({k:"traslado",label:"Traslados aeropuerto ⇄ hotel",prov:"PriceAgencies",net,sale:net*1.15,web:140000*pax})}
    const sum=k=>lines.reduce((s,l)=>s+l[k],0);
    return {key,label,hotel:h,lines,net:sum("net"),sale:sum("sale"),web:sum("web")};
  });
  const recKey=/Hasta/.test(lead.budget)?"econ":/Más de/.test(lead.budget)?"prem":"rec";
  let shown=e.onlyRec?tiers.filter(t=>t.key===recKey):tiers;
  return {tiers:shown,recKey,pax,rooms,nights,hasF,hasT};
}

/* ---------- Render principal ---------- */
const ICONS={

function render(){
  const act=document.activeElement, fid=act&&act.id, val=act&&act.value, sel=act&&act.selectionStart;
  const keep={};document.querySelectorAll("input[data-keep]").forEach(i=>keep[i.id]=i.value);

  const running=state.quotes.filter(q=>q.status==="running").length;
  $("#rail").innerHTML=[["leads","Leads",newCount],["quotes","Cotizar",running],["wa","WhatsApp",0],["settings","Ajustes",0]]
    .map(([v,l,b])=>`<button data-act="nav" data-v="${v}" ${state.view===v?'aria-current="page"':""}>${ICONS[v]}${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("");
  const main=$("#main");
  main.innerHTML = state.view==="leads"?viewLeads():state.view==="quotes"?viewQuotes():state.view==="wa"?viewWA():viewSettings();
  $("#overlay").innerHTML = (state.drawer?viewDrawer():"") + (state.modal?viewModal():"");
  Object.entries(keep).forEach(([id,v])=>{const i=document.getElementById(id);if(i)i.value=v});
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(val!=null&&el.setSelectionRange&&el.type==="text"){try{el.setSelectionRange(sel,sel)}catch(e){}}}}
  document.querySelectorAll(".msgs,.wa-msgs").forEach(b=>{if(b.dataset.stick!=="0")b.scrollTop=b.scrollHeight});
}

/* ---------- Vista: Leads ---------- */
function viewLeads(){
  const L=state.leads;
  const sent=L.filter(l=>["enviado","ganado"].includes(l.stage)).length;
  const runningQ=state.quotes.filter(q=>q.status==="running").length;
  const cols=STAGES.map(([k,label])=>{
    const items=L.filter(l=>l.stage===k).sort((a,b)=>b.at-a.at);
    return `<section class="col" aria-label="${label}"><div class="col-head"><span>${label}</span><span class="count">${items.length}</span></div>
      ${items.map(card).join("")||`<p style="color:var(--muted);font-size:12.5px;margin:4px">Sin leads aquí.</p>`}</section>`;
  }).join("");
  return `<div class="view">
    <div class="view-head"><div><h1>Leads</h1><p>Cada conversación de WhatsApp que termina el cuestionario aparece aquí con sus datos. Abre un lead y dale a <b>Iniciar cotización</b>.</p></div>
    <button class="btn" data-act="nav" data-v="wa">${ICONS.wa}Simular cliente nuevo</button></div>
    <div class="stats">
      <div class="stat"><b>${L.filter(l=>l.stage==="nuevo").length}</b><span>Leads sin cotizar</span></div>
      <div class="stat"><b>${runningQ}</b><span>Cotizaciones en curso</span></div>
      <div class="stat"><b>${sent}</b><span>Cotizaciones enviadas</span></div>
      <div class="stat"><b>${lastQuoteSecs==null?"—":lastQuoteSecs+" s"}</b><span>Duración de la última búsqueda</span></div>
    </div>
    <div class="board-wrap"><div class="board">${cols}</div></div></div>`;
}
function card(l){
  const d=DEST[l.dest];
  return `<button class="card${l.flash?" flash":""}" data-act="open-lead" data-id="${l.id}">
    <div class="card-top"><span class="card-name">${esc(l.name)}</span><span class="card-time">${ago(l.at)}</span></div>
    <div class="route"><span>${l.orig}</span><span class="arrow">→</span><span>${d.iata}</span><span style="color:var(--muted);font-family:var(--f-body)">${d.city}</span></div>
    <div class="meta"><span>${l.dates.label}</span><span>${paxLabel(l.pax)}</span><span>${incLabel[l.inc]}</span></div>
    <div class="card-foot"><span class="src">${WAICON}WhatsApp</span>${l.replied?`<span class="pill enviado">Cliente respondió</span>`:l.fresh&&l.stage==="nuevo"?`<span class="new-flag">● Nuevo</span>`:""}</div>
  </button>`;
}
function viewDrawer(){
  const l=state.leads.find(x=>x.id===state.drawer); if(!l) return "";
  const d=DEST[l.dest], q=state.quotes.find(x=>x.leadId===l.id);
  const stage=STAGES.find(s=>s[0]===l.stage)[1];
  let action;

    m:{h:state.settings.mHotel,f:state.settings.mFlight,t:state.settings.mTour},edits:{noTours:false,transfers:false,onlyRec:false},prov:{}};
  PROV.forEach(p=>q.prov[p.id]={done:false});
  state.quotes.push(q);state.activeQuote=q.id;l.stage="cotizando";l.fresh=false;state.drawer=null;state.view="quotes";state.pane="chat";
  render();
  const d=DEST[l.dest];
  pushMsg(q,{role:"agent",html:`<p>Recibí el lead de <b>${esc(l.name)}</b>: ${d.city} desde ${ORIG[l.orig].city}, ${l.dates.label} (${l.dates.nights} noches), ${paxLabel(l.pax)}, ${incLabel[l.inc].toLowerCase()}.</p>`});
  await sleep(500);
  pushMsg(q,{role:"agent",type:"board"});
  const t0=Date.now();
  await Promise.all(PROV.map(async p=>{
    const ms=p.t[0]+(p.t[1]-p.t[0])*hash(q.id+p.id);
    await sleep(ms);
    const n=d.hotels.filter(h=>hash(p.id+h.n)>0.22).length;
    q.prov[p.id]={done:true,ms,count:n*3+Math.floor(hash(p.id+l.id)*6)+(p.prod.includes("vuelo")&&l.inc!=="h"?4:0)};
    if(state.view==="quotes"&&state.activeQuote===q.id)render();
  }));
  pushMsg(q,{role:"agent",html:`<p>Listo. HotelDO y Grupos Travel no venden aéreos, así que los vuelos salen de PriceAgencies y Osiris. Me quedo con la mejor tarifa neta por hotel.</p>`});
  const w={role:"agent",type:"web",done:false};pushMsg(q,w);
  await sleep(1300);w.done=true;
  pushMsg(q,{role:"agent",type:"cmp"});
  await sleep(400);
  q.status="draft";l.stage="borrador";lastQuoteSecs=Math.round((Date.now()-t0)/1000)+1;
  pushMsg(q,{role:"agent",html:`<p>Armé el borrador con ${l.inc==="h"?"3 opciones de hotel":"3 opciones"}. Margen aplicado: hotel ${q.m.h}%, vuelos ${q.m.f}%, tours ${q.m.t}%. Vigencia de ${state.settings.validity} horas.</p><p>Revísalo en el panel del borrador. Si quieres cambiar algo, pídemelo aquí; cuando esté bien, apruébalo.</p>`});
  if(!(state.view==="quotes"&&state.activeQuote===q.id)) toast(`Borrador listo para ${esc(l.name.split(" ")[0])}`,"Ver","goto-quote",q.id);
}
function agentEdit(q,txt){
  const t=txt.toLowerCase(), e=q.edits, done=[];
  const l=state.leads.find(x=>x.id===q.leadId);
  const num=(t.match(/(\d{1,2})\s*%/)||[])[1];
  if(/margen/.test(t)&&num){const k=/vuelo/.test(t)?"f":/tour/.test(t)?"t":"h";q.m[k]=+num;done.push(`margen de ${{h:"hotel",f:"vuelos",t:"tours"}[k]} en ${num}%`)}
  if(/(quita|sin|elimina).*(tour|excursi)/.test(t)){if(l.inc!=="full"){pushMsg(q,{role:"agent",html:"<p>Esta cotización no incluye tours, así que no hay nada que quitar.</p>"});return}e.noTours=true;done.push("quité los tours")}
  if(/(agrega|pon|incluye|añade).*(tour|excursi)/.test(t)&&e.noTours){e.noTours=false;done.push("volví a incluir los tours")}
  if(/traslado/.test(t)){if(/(quita|sin)/.test(t)){e.transfers=false;done.push("quité los traslados")}else{e.transfers=true;done.push("agregué traslados aeropuerto ⇄ hotel")}}
  if(/solo.*recomendad|una sola opci/.test(t)){e.onlyRec=true;done.push("dejé solo la opción recomendada")}
  if(/(3|tres).*opcion|todas las opcion/.test(t)){e.onlyRec=false;done.push("volví a mostrar las 3 opciones")}
  if(!done.length){pushMsg(q,{role:"agent",html:`<p>En esta demo entiendo ajustes de margen, tours, traslados y cantidad de opciones. En la versión real el agente interpreta cualquier instrucción, por ejemplo cambiar de hotel o de fechas.</p>`});return}
  q.version++;q.status="draft";
  pushMsg(q,{role:"agent",html:`<p>Hecho: ${done.join(", ")}. Generé la versión ${q.version} del borrador; tienes que aprobarla otra vez.</p>`});
  pushMsg(q,{role:"agent",type:"cmp"});
}
function sendQuote(q){
  const l=state.leads.find(x=>x.id===q.leadId);
  q.status="sent";q.sentAt=Date.now();l.stage="enviado";l.sentAt=q.sentAt;
  state.wa.convos[l.id].push({dir:"out",pdf:{code:q.code},txt:`Hola ${l.name.split(" ")[0]}, te comparto tu cotización para ${DEST[l.dest].city}. Tiene vigencia de ${state.settings.validity} horas. Cualquier duda, me escribes por aquí.`,at:Date.now()});
  pushMsg(q,{role:"agent",html:`<p>Enviado por WhatsApp a ${esc(l.name)} (${l.phone}). Como el cliente escribió en las últimas 24 horas, este envío no tiene costo de mensaje. El lead pasó a <b>Enviado</b>.</p>`});
  toast(`Cotización ${q.code} enviada por WhatsApp`,"Ver chat","goto-wa",l.id);
}

/* ---------- WhatsApp: intake ---------- */
async function waSay(txt){
  const cid=state.wa.active, conv=state.wa.convos[cid], it=state.wa.intake;
  conv.push({dir:"in",txt,at:Date.now()});render();
  const lead=state.leads.find(l=>l.id===cid);
  if(lead&&(!it||it.cid!==cid)){
    if(lead.stage==="enviado"){lead.replied=true;await botSay(cid,"¡Qué bien! Le aviso a Ana para que te ayude con la reserva 🙌");toast(`${esc(lead.name.split(" ")[0])} respondió a su cotización`,"Ver lead","open-lead",lead.id)}
    else await botSay(cid,"Gracias por escribir. Una asesora te responde en breve.");
    return;
  }
  if(!it) return;
  if(it.step===-1){it.step=0;await botSay(cid,INTAKE[0].q(it.v));return}
  const s=INTAKE[it.step];
  const val=s.parse?s.parse(txt):txt.trim();
  if(val==null){await botSay(cid,s.err);return}
  it.v[s.k]=val;it.step++;
  if(it.step<INTAKE.length){await botSay(cid,INTAKE[it.step].q(it.v));return}
  await botSay(cid,`¡Listo, ${it.v.name.split(" ")[0]}! Ya tengo todo. Una asesora te envía tu cotización por aquí en breve 🙌`);
  const id="L"+(state.leads.length+1);
  const l={id,name:it.v.name,phone:"+57 3** *** **"+String(10+state.leads.length*7).slice(-2),dest:it.v.dest,orig:it.v.orig,dates:it.v.dates,pax:it.v.pax,inc:it.v.inc,budget:it.v.budget,stage:"nuevo",at:Date.now(),fresh:true,flash:true};
  state.leads.push(l);state.wa.convos[id]=state.wa.convos[cid];delete state.wa.convos[cid];state.wa.active=id;state.wa.intake=null;
  render();setTimeout(()=>{l.flash=false},2000);
  toast(`Nuevo lead en el CRM: ${esc(l.name)}`,"Ver lead","open-lead",id);
}
async function botSay(cid,txt){
  state.wa.typing=cid;render();await sleep(650);state.wa.typing=null;
  state.wa.convos[cid].push({dir:"out",txt,at:Date.now()});render();
}

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){return}
  if(el.dataset.act.startsWith("close")&&e.target.closest("[data-stop]")&&el.classList.contains("scrim")) return;
  if((el.classList.contains("scrim")||el.classList.contains("modal"))&&e.target!==el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="nav"){state.view=el.dataset.v;state.drawer=null;if(state.view==="wa"&&el.textContent.includes("Simular")){newWA();return}}
  else if(a==="open-lead"){state.view="leads";state.drawer=id}
  else if(a==="close-drawer"){state.drawer=null}
  else if(a==="start-quote"){startQuote(id);return}
  else if(a==="goto-quote"){state.view="quotes";state.activeQuote=id;state.drawer=null}
  else if(a==="tab"){state.activeQuote=id}
  else if(a==="pane"){state.pane=el.dataset.v}
  else if(a==="approve"){const q=state.quotes.find(x=>x.id===id);q.status="approved";pushMsg(q,{role:"user",html:`<p>Aprobado ✓</p>`});return}
  else if(a==="send"){sendQuote(state.quotes.find(x=>x.id===id));return}
  else if(a==="say"){const q=state.quotes.find(x=>x.id===state.activeQuote);pushMsg(q,{role:"user",html:`<p>${esc(el.dataset.txt)}</p>`});setTimeout(()=>agentEdit(q,el.dataset.txt),500);return}
  else if(a==="goto-wa"){state.view="wa";state.wa.active=id;state.drawer=null}
  else if(a==="wa-open"){state.wa.active=id}
  else if(a==="wa-new"){newWA();return}
  else if(a==="wa-say"){waSay(el.dataset.txt);return}
  else if(a==="view-pdf"){state.modal=el.dataset.code}
  else if(a==="close-modal"){state.modal=null}
  render();
});
function newWA(){
  if(state.wa.intake){state.wa.active=state.wa.intake.cid;state.view="wa";render();return}
  const cid="N"+Date.now();state.wa.convos[cid]=[];state.wa.intake={cid,step:-1,v:{}};state.wa.active=cid;state.view="wa";render();
}
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.form==="agent"){const i=$("#agent-in");const v=i.value.trim();if(!v)return;i.value="";const q=state.quotes.find(x=>x.id===state.activeQuote);pushMsg(q,{role:"user",html:`<p>${esc(v)}</p>`});setTimeout(()=>agentEdit(q,v),500)}
  if(f.dataset.form==="wa"){const i=$("#wa-in");const v=i.value.trim();if(!v)return;i.value="";waSay(v)}
});
document.addEventListener("change",e=>{
  const s=e.target.dataset.set;if(s){state.settings[s]=Math.max(0,+e.target.value||0);toast("Ajuste guardado. Aplica a las cotizaciones nuevas.");}
  if(e.target.id==="convo-select"){state.wa.active=e.target.value;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(state.drawer||state.modal)){state.drawer=null;state.modal=null;render()}});
setInterval(()=>{if(state.view==="leads"&&!state.drawer)render()},60000);

const startHash=(location.hash||"").slice(1);
if(["leads","quotes","wa","settings"].includes(startHash)) state.view=startHash;
render();
</script>
